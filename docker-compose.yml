services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wikicode}
      MYSQL_USER: ${MYSQL_USER:-wikicode}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wikicode_local_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wikicode_root_2026}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:-http://localhost:8088}
      APP_KEY: ${APP_KEY:-local-development-key-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wikicode.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-WikiCode2026!}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-wikicode}
      DB_USERNAME: ${MYSQL_USER:-wikicode}
      DB_PASSWORD: ${MYSQL_PASSWORD:-wikicode_local_2026}
    ports:
      - "8088:80"
    volumes:
      - repository-data:/var/www/html/storage/repositories
      - repository-locks:/var/www/html/storage/locks
      - release-data:/var/www/html/storage/releases

volumes:
  mysql-data:
  repository-data:
  repository-locks:
  release-data:
